# USGS M2M provider — Landsat only. Needs USGS_M2M_USERNAME and
# USGS_M2M_TOKEN set in your environment (do NOT put credentials in this
# file). Heavier than the STAC providers: each scene requires a full
# bundle download + local extraction, so keep the AOI/date range small
# for a first test.
# Run: python -m data_loader --config examples/usgs_m2m.yaml

aoi:
  upper_left: [-123.855, 45.896]
  lower_right: [-123.835, 45.882]

provider: usgs_m2m

sensors:
  - name: landsat

date_range:
  start: "2020-06-01"
  end: "2020-06-30"

filters:
  max_cloud_percent: 40
  pixel_cloud_mask: true

temporal_mode: scene

output:
  indices: [nbr]
  dir: output/usgs_m2m
